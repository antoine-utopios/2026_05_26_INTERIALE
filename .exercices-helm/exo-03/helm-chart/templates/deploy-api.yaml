apiVersion: apps/v1
kind: Deployment
metadata:
  name: exo-07-api-deployment
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      app: exo-07-api
  template:
    metadata:
      name: exo-07-api-pod
      labels:
        app: exo-07-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "country"
                    operator: "In"
                    values: [{{ .Values.deployLocation.api }}]
      tolerations:
        - key: "country"
          value: {{ .Values.deployLocation.api }}
          operator: "Equal"
      containers:
      - name: exo-07-api-container
        image: username/api
        ports:
        - containerPort: 3000
