apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deployment
  labels:
    tier: frontend
    app: nginx
spec:
  replicas: 9
  selector:
    matchLabels:
      tier: frontend
      app: nginx
  template:
    metadata:
      name: demo-pod
      labels:
        tier: frontend
        app: nginx
    spec:
      containers:
      - name: demo-container
        image: nginx:alpine
        ports:
          - containerPort: 80
        env:
          - name: MA_VARIABLE_A
            value: "Toto"
          - name: MOT_DE_PASSE_BDD
            valueFrom:
              secretKeyRef:
                key: MYSQL_PASSWORD
                name: demo-secret