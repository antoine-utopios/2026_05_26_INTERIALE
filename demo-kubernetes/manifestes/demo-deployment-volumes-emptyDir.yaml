apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deployment
  labels:
    tier: frontend
    app: nginx
spec:
  replicas: 9
  selector:
    matchLabels:
      tier: frontend
      app: nginx
  template:
    metadata:
      name: demo-pod
      labels:
        tier: frontend
        app: nginx
    spec:
      containers:
      - name: demo-container
        image: nginx:alpine
        ports:
          - containerPort: 80
        volumeMounts:
          - name: data-emptydir
            mountPath: /data/files
      volumes:
        - name: data-emptydir 
          emptydir:
            sizeLimit: "500Mi" 