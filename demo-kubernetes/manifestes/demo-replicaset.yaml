apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: demo-replicaset
  labels:
    tier: frontend
    app: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      tier: frontend
      app: nginx
  template:
    metadata:
      name: demo-pod
      labels:
        tier: frontend
        app: nginx
    spec:
      containers:
      - name: demo-container
        image: nginx:alpine
        ports:
          - containerPort: 80

